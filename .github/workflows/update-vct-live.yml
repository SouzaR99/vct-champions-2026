name: Atualizar VCT Champions 2026 — Live

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vct-live-sync
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar dados do VCT
        run: node update-vct.mjs

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos dados."
            exit 0
          fi

          git commit -m "Atualização automática VCT Champions 2026"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
