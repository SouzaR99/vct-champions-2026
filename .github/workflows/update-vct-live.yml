name: Atualizar VCT Champions 2026 — Live

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vct-live-sync
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar dados, imagens e detalhes de partidas
        run: node update-vct.mjs

      - name: Commitar somente se mudou
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if git diff --cached --quiet; then
            echo 'Nenhuma mudança.'
          else
            git commit -m 'Atualização automática VCT Champions 2026'
            git push
          fi
